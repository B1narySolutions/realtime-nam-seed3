name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# A new push to a branch cancels that branch's run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Full history, so a comment-only pull request can build its base.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # libs/ holds the pinned libDaisy and NAM Core checkouts and the
      # libDaisy build. install.sh holds the pins, so it is the cache key.
      - uses: actions/cache@v4
        with:
          path: libs
          key: libs-${{ runner.os }}-${{ hashFiles('scripts/install.sh') }}

      - name: Install the toolchain and pinned dependencies
        run: bash scripts/install.sh

      # Same version as the Makefile's CLANG_FORMAT_VERSION. The runner image
      # has its own clang-format, so check which one PATH finds.
      - name: Install clang-format
        run: |
          pipx install clang-format==23.1.3
          clang-format --version | grep -q ' 23\.1\.3' || { echo "PATH finds $(command -v clang-format), not 23.1.3" >&2; exit 1; }

      # The models are T3K-licensed: download them fresh for this run's build
      # and tests, and never cache them or upload anything built from them.
      - name: Download the amp models
        run: bash scripts/download_models.sh

      - name: make check
        run: make check

      - name: Comment-only change builds identical firmware
        if: contains(github.event.pull_request.labels.*.name, 'comment-only')
        run: make check-comment-only BASE=origin/${{ github.base_ref }}
